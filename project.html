<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects</title>
  <link rel="icon" href="icons/logosss.png" type="image/png" />

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400&display=swap"
    rel="stylesheet" />
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <noscript>
    <script src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </noscript>

  <link rel="stylesheet" href="styles/shared.css">
  <link rel="stylesheet" href="styles/navbar.css">
  <link rel="stylesheet" href="styles/project.css">
</head>

<body data-page="project">
  <script src="scripts/navbar.js"></script>

  <div class="search-filter-container">
    <div class="search-box">
      <ion-icon name="search-outline"></ion-icon>
      <input type="text" id="searchInput" placeholder="Search projects..." />
    </div>
    <div class="filter-wrapper">
      <button class="filter-button" id="filterBtn">
        <ion-icon name="options-outline"></ion-icon>
        Filter
      </button>
      <div class="filter-dropdown" id="filterDropdown">
        <div class="filter-label">Technologies</div>
        <div class="filter-options">
          <label class="filter-option">
            <input type="checkbox" value="react" />
            <span>React</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" value="typescript" />
            <span>TypeScript</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" value="python" />
            <span>Python</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" value="swiftui" />
            <span>SwiftUI</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" value="sql" />
            <span>SQL</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" value="tkinter" />
            <span>Tkinter</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" value="tailwind" />
            <span>Tailwind CSS</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" value="htmljscss" />
            <span>HTML, JS, CSS</span>
          </label>
        </div>
      </div>
    </div>
    <div class="projects-wrapper">
      <button class="projects-button" id="projectsBtn">
        <ion-icon name="list-outline"></ion-icon>
        Projects (7)
      </button>
      <div class="projects-dropdown" id="projectsDropdown">
        <div class="projects-label"> Projects (new to old)</div>
        <div class="projects-list-items">
          <div class="project-list-item" data-project="colordrift">Colordrift</div>
          <div class="project-list-item" data-project="astromath">Astromath</div>
          <div class="project-list-item" data-project="projectwhisper">Project Whisper</div>
          <div class="project-list-item" data-project="kitchen-mate">Kitchen-mate</div>
          <div class="project-list-item" data-project="subhub">SubHub</div>
          <div class="project-list-item" data-project="money-mate">Money-Mate</div>
          <div class="project-list-item" data-project="lifeline">LifeLine</div>
        </div>
      </div>
    </div>
  </div>

  <div class="projects-grid">
    <script src="components/projects/colordrift.js"></script>
    <script src="components/projects/astromath.js"></script>
    <script src="components/projects/projectwhisper.js"></script>
    <script src="components/projects/kitchen-mate.js"></script>
    <script src="components/projects/subhub.js"></script>
    <script src="components/projects/money-mate.js"></script>
    <script src="components/projects/lifeline.js"></script>
  </div>
  </div>



  <div class="image-modal" id="imageModal">
    <div class="image-modal-content">
      <button class="image-modal-close" onclick="closeImageModal()">
        &times;
      </button>
      <img id="modalImage" src="" alt="Enlarged image" />
    </div>
  </div>

  <div class="social-links">
    <a href="https://github.com/samyakchat" class="social-btn" target="_blank"><ion-icon
        name="logo-github"></ion-icon></a>
    <a href="https://www.linkedin.com/in/samyak-chatterjee-74961b331/" class="social-btn" target="_blank"><ion-icon
        name="logo-linkedin"></ion-icon></a>
    <a href="https://www.instagram.com/samyakchat/" class="social-btn" target="_blank"><ion-icon
        name="logo-instagram"></ion-icon></a>
    <a href="mailto:samyakchat@gmail.com" class="social-btn"><ion-icon name="mail"></ion-icon></a>
  </div>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>

  <script>
    const searchInput = document.getElementById("searchInput");
    const filterBtn = document.getElementById("filterBtn");
    const filterDropdown = document.getElementById("filterDropdown");
    const projectsBtn = document.getElementById("projectsBtn");
    const projectsDropdown = document.getElementById("projectsDropdown");
    const filterCheckboxes = document.querySelectorAll(".filter-option input[type='checkbox']");
    const projectSections = document.querySelectorAll(".project-section");
    const projectListItems = document.querySelectorAll(".project-list-item");

    filterBtn.addEventListener("click", () => {
      filterDropdown.classList.toggle("active");
      projectsDropdown.classList.remove("active");
    });

    projectsBtn.addEventListener("click", () => {
      projectsDropdown.classList.toggle("active");
      filterDropdown.classList.remove("active");
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".filter-wrapper")) {
        filterDropdown.classList.remove("active");
      }
      if (!e.target.closest(".projects-wrapper")) {
        projectsDropdown.classList.remove("active");
      }
    });

    searchInput.addEventListener("input", filterProjects);

    filterCheckboxes.forEach((checkbox) => {
      checkbox.addEventListener("change", filterProjects);
    });

    function filterProjects() {
      const searchTerm = searchInput.value.toLowerCase();
      const selectedTechs = Array.from(filterCheckboxes)
        .filter((cb) => cb.checked)
        .map((cb) => cb.value);

      projectSections.forEach((project) => {
        const title = project.querySelector("h1").textContent.toLowerCase();
        const description = project.querySelector("p").textContent.toLowerCase();
        const projectTechs = project.dataset.tech.split(",");

        const matchesSearch = title.includes(searchTerm) || description.includes(searchTerm);

        const matchesFilters =
          selectedTechs.length === 0 ||
          selectedTechs.some((tech) => projectTechs.includes(tech.toLowerCase()));

        const shouldShow = matchesSearch && matchesFilters;

        project.style.display = shouldShow ? "flex" : "none";
        const projectId = project.id;
        const listItem = document.querySelector(
          `.project-list-item[data-project="${projectId}"]`
        );
        if (listItem) {
          listItem.classList.toggle("hidden", !shouldShow);
        }
      });
    }

    projectListItems.forEach((item) => {
      item.addEventListener("click", () => {
        const projectId = item.dataset.project;
        const projectElement = document.getElementById(projectId);
        if (projectElement && projectElement.style.display !== "none") {
          projectElement.scrollIntoView({ behavior: "smooth" });
          projectElement.style.animation = "pulse 0.5s ease";
        }
      });
    });

    function openImageModal(imageSrc) {
      const modal = document.getElementById("imageModal");
      const modalImage = document.getElementById("modalImage");
      modalImage.src = imageSrc;
      modal.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeImageModal() {
      const modal = document.getElementById("imageModal");
      modal.classList.remove("active");
      document.body.style.overflow = "auto";
    }

    window.onclick = function (event) {
      const modal = document.getElementById("imageModal");
      if (event.target === modal) {
        closeImageModal();
      }
    };

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeImageModal();
      }
    });

    function toggleGallery(button) {
      const gallery = button.nextElementSibling;
      gallery.classList.toggle("hidden");
      button.classList.toggle("closed");

      if (gallery.classList.contains("hidden")) {
        button.innerHTML =
          '<svg class="gallery-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>View Images';
      } else {
        button.innerHTML =
          '<svg class="gallery-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>Hide Images';
        const galleryContainer = gallery;
        const images = galleryContainer.querySelectorAll(".gallery-image");
        images.forEach((img) => {
          img.onclick = function (e) {
            e.stopPropagation();
            openImageModal(this.src);
          };
        });
      }
    }

    function toggleSubHub(button) {
      const content = button.nextElementSibling;
      content.classList.toggle("hidden");
      button.classList.toggle("closed");

      if (content.classList.contains("hidden")) {
        button.innerHTML =
          '<svg class="gallery-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>View Images';
      } else {
        button.innerHTML =
          '<svg class="gallery-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>Hide Images';
        const images = content.querySelectorAll(".gallery-image");
        images.forEach((img) => {
          img.onclick = function (e) {
            e.stopPropagation();
            openImageModal(this.src);
          };
        });
      }
    }

    window.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".gallery-image").forEach((img) => {
        img.onclick = function (e) {
          e.stopPropagation();
          openImageModal(this.src);
        };
      });
    });
  </script>
</body>

</html>
