<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Design — In Progress</title>
  <link rel="icon" href="icons/logosss.png" type="image/png">

  <!-- Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400&display=swap" rel="stylesheet">

  <style>
:root {
      --bg: #F9F6F6;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
--accent-blue: #2B6CBB;
      --accent-yellow: #e67700;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(135deg, #F9F6F6, #f1f5f9);
      color: var(--text);
      font-family: 'Open Sans', sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    /* NAVBAR */
    .navbar {
      max-width: 1200px;
      margin: 40px auto 0;
      padding: 0 24px 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      border-bottom: 1px solid var(--border);
    }

    .navbar-left a {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .navbar-right {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    .nav-btn {
      background: none;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      color: var(--text);
    }

    .nav-btn.selected {
      color: var(--text);
      border-bottom: 2px solid var(--text);
      padding-bottom: 2px;
    }

    /* GRID */
    .container {
      max-width: 1200px;
      margin: 76px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      column-gap: 32px;
      row-gap: 96px;
    }

    /* HEADER */
    .header {
      grid-column: 1 / 7;
    }

    .header h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.2rem;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    .header p {
      max-width: 520px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--muted);
    }

    /* PLACEHOLDER PANEL */
    .status-panel {
      grid-column: 7 / -1;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: fit-content;
    }

    .status-panel ion-icon {
      font-size: 32px;
      color: var(--text);
    }

    .status-panel h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      margin: 0;
    }

    .status-panel p {
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--muted);
      margin: 0;
      max-width: 420px;
    }

    .status-meta {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 8px;
    }

    @media (max-width: 900px) {
      .header,
      .status-panel {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="navbar-left">
      <a href="index.html">Samyak Chatterjee</a>
    </div>
    <div class="navbar-right">
      <button class="nav-btn" onclick="location.href='index.html'">
        <ion-icon name="arrow-back-outline"></ion-icon>
        Main Portfolio
      </button>
      <button class="nav-btn selected">Design</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="container">

    <div class="header">
      <h1>Design</h1>
      <p>
        Almost done!
      </p>
    </div>

    <div class="status-panel">
      <ion-icon name="construct-outline"></ion-icon>
      <h3>Page in Progress</h3>
      <p>
        This will be the design area of my portfolio
      </p>
      <div class="status-meta">
        <span>abcd</span>
        <span>12334</span>
      </div>
    </div>

  </div>

</body>
</html>
